<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Edge Camera Discovery</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Edge Camera Discovery</h1>
        <button id="refresh-btn" title="Refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </header>

      <main>
        <div id="camera-list"></div>
        <div id="empty-state">
          <div class="spinner"></div>
          <p>Searching for cameras...</p>
        </div>
      </main>

      <footer>
        <span id="status">Scanning...</span>
      </footer>
    </div>

    <div id="toast" class="hidden"></div>

    <dialog id="trust-dialog">
      <h2 id="trust-title"></h2>
      <div class="dlg-camera" id="trust-camera"></div>
      <div id="trust-body"></div>
      <div class="dlg-actions">
        <button type="button" class="btn" id="trust-cancel">Cancel</button>
        <button type="button" class="btn primary" id="trust-accept">Trust camera</button>
      </div>
    </dialog>

    <dialog id="setip-dialog">
      <form id="setip-form" novalidate>
        <h2>Change IP Address</h2>
        <div class="dlg-camera" id="dlg-camera"></div>
        <div class="dlg-current" id="dlg-current"></div>

        <div id="dlg-body">
          <div class="suggestion hidden" id="suggestion">
            <span id="suggestion-text"></span>
            <button type="button" class="btn small" id="suggestion-apply">Use</button>
          </div>

          <div class="field-group">
            <div class="mode-switch" role="radiogroup" aria-label="Mode">
              <label><input type="radio" name="mode" value="static" checked> Static</label>
              <label><input type="radio" name="mode" value="dhcp"> DHCP</label>
            </div>

            <div id="static-fields">
              <label class="field">
                <span>IP address / prefix</span>
                <input id="f-address" type="text" placeholder="192.168.1.50/24" spellcheck="false">
              </label>
              <label class="field">
                <span>Gateway <em>(optional)</em></span>
                <input id="f-gateway" type="text" placeholder="none" spellcheck="false">
              </label>
            </div>

            <div id="dhcp-fields" class="hidden">
              <p class="hint">If no DHCP server answers, the camera uses this fallback address.</p>
              <label class="field">
                <span>Fallback address / prefix <em>(optional)</em></span>
                <input id="f-fb-address" type="text" placeholder="none" spellcheck="false">
              </label>
              <label class="field">
                <span>Fallback gateway <em>(optional)</em></span>
                <input id="f-fb-gateway" type="text" placeholder="none" spellcheck="false">
              </label>
            </div>

            <label class="field">
              <span>DNS servers <em>(optional, comma-separated)</em></span>
              <input id="f-dns" type="text" placeholder="automatic" spellcheck="false">
            </label>
          </div>
        </div>

        <div class="dlg-message hidden" id="dlg-message"></div>

        <div class="dlg-actions">
          <button type="button" class="btn dlg-left" id="dlg-default"
            title="Reset the network settings to the camera's factory defaults">Factory default</button>
          <button type="button" class="btn" id="dlg-cancel">Cancel</button>
          <button type="submit" class="btn primary" id="dlg-apply">Apply</button>
          <button type="button" class="btn primary hidden" id="dlg-open">Open web interface</button>
        </div>
      </form>
    </dialog>

    <dialog id="login-dialog">
      <form id="login-form" novalidate>
        <h2 id="login-title">Camera Login</h2>
        <div class="dlg-camera" id="login-camera"></div>
        <p class="trust-text" id="login-summary"></p>

        <div class="field-group">
          <div class="field-row">
            <label class="field">
              <span>User</span>
              <input id="f-user" type="text" value="admin" autocomplete="off" spellcheck="false">
            </label>
            <label class="field">
              <span>Password</span>
              <input id="f-password" type="password" autocomplete="off">
            </label>
          </div>
          <p class="hint">The credentials of the camera's web interface. They are sent encrypted and are not stored.</p>
        </div>

        <div class="dlg-message hidden" id="login-message"></div>

        <div class="dlg-actions">
          <button type="button" class="btn" id="login-cancel">Cancel</button>
          <button type="submit" class="btn primary" id="login-apply">Apply</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
