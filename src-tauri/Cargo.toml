[package]
name = "ecm-discovery"
version = "0.10.0-alpha.1"
description = "Discover 3dvisionlabs ECM cameras on the local network"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "ecm_discovery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ecmdp = { path = "../crates/ecmdp" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt", "sync", "time", "io-util"] }
hex = "0.4"
humantime = "2"
if-addrs = "0.15"
simple-dns = "0.12"
zeroize = "1"
