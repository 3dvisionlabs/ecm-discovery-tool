name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Platform-independent checks: once on Linux is enough
  lint:
    name: Lint and format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      # Also type-checks the UI
      - name: Build frontend
        run: npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Platform-specific code (macOS menu, XWayland switch, network crates) only
  # compiles on its own platform, so clippy and tests run on all three.
  # Debug builds do not need the built UI (they use devUrl), hence no npm here.
  test:
    name: Clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
