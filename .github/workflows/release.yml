name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # Oldest supported runner: packages then also run on older distributions (glibc)
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage
          - name: macOS
            os: macos-latest
            bundles: app,dmg
            files: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.zip
          - name: Windows
            os: windows-latest
            bundles: nsis
            files: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/*.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Zip macOS app
        if: runner.os == 'macOS'
        working-directory: target/release/bundle/macos
        run: |
          VERSION=$(node -p "require('../../../../package.json').version")
          ditto -c -k --keepParent "Edge Camera Discovery.app" "Edge Camera Discovery_${VERSION}_aarch64.app.zip"

      - name: Zip Windows portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Compress-Archive -Path target/release/ecm-discovery.exe -DestinationPath "target/release/bundle/Edge Camera Discovery_${version}_x64-portable.zip"

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # Tags like v0.10.0-alpha.1 become a pre-release, never "Latest"
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: ${{ matrix.files }}
