name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # Oldest supported runner: packages then also run on older distributions (glibc)
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - name: macOS
            os: macos-latest
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf desktop-file-utils

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        # Also builds the command line tool (beforeBuildCommand), which the packages include
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      # The bundled libwayland breaks WebKit with newer Mesa (EGL_BAD_PARAMETER, empty window)
      - name: Remove bundled libwayland from AppImage
        if: runner.os == 'Linux'
        run: ./scripts/fix-appimage.sh target/release/bundle/appimage/*.AppImage

      # One name scheme for all files (ecm-discovery_<version>_<os>_<arch>...),
      # plus the portable archives with app and command line tool
      - name: Collect release files
        shell: bash
        run: ./scripts/collect-release-files.sh target/release/upload

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # Tags like v0.10.0-alpha.1 become a pre-release, never "Latest"
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: target/release/upload/*
