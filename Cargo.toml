[workspace]
members = ["protocol", "lib", "cli", "app"]
resolver = "3"

[workspace.package]
# App and CLI; keep in sync with package.json
version = "0.10.0-alpha.2"
edition = "2024"
license = "MIT"
authors = ["3dvisionlabs GmbH"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Small binary: the app does little CPU work
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
